name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: subscription-manager/go.mod
      - name: Check Go and shell syntax
        run: |
          make fmt-check
          sh -n telemt-egress-tproxy.sh
      - name: Run offline tests
        run: make test
      - name: Validate Compose and config
        run: make config-check compose-check
      - name: Build subscription manager
        run: docker build -t subscription-manager-ci subscription-manager
