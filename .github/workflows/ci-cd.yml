name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: subscription-manager/go.mod
          cache: true
          cache-dependency-path: subscription-manager/go.mod
      - name: Run checks
        run: make check
      - name: Isolated deployment smoke test
        run: make deployment-smoke

  build:
    name: Build Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build images
        run: make build

  deploy:
    name: Deploy to VM
    needs: [check, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd "${{ secrets.VM_PROJECT_PATH }}"
            exec 9>.deploy.lock
            flock -x 9
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            sha='${{ github.sha }}'
            test "$(git rev-parse --verify "$sha^{commit}")" = "$sha"
            git checkout --detach "$sha"
            DEPLOY_LOCKED=1 make deploy
            make status
